<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Página no encontrada')}"></head>
<body>
<main class="pagina-centrada">
    <section class="tarjeta tarjeta-centrada">
        <span class="resumen-icono rojo"><svg th:replace="~{fragmentos/iconos :: icono('alerta')}"></svg></span>
        <p class="codigo-error" >404</p>
        <h2>Página no encontrada</h2>
        <p>La dirección que intentó abrir no existe o fue movida.</p>
        <a class="btn btn-primario" th:href="@{/}">
            <svg th:replace="~{fragmentos/iconos :: icono('inicio')}"></svg> Volver al inicio
        </a>
    </section>
</main>
</body>
</html>
