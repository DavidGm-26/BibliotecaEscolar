<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Solicitud no válida')}"></head>
<body>
<main class="pagina-centrada">
    <section class="tarjeta tarjeta-centrada">
        <span class="resumen-icono rojo"><svg th:replace="~{fragmentos/iconos :: icono('alerta')}"></svg></span>
        <p class="codigo-error" th:text="${status}">400</p>
        <h2>No se pudo procesar la solicitud</h2>
        <p>Revise los datos enviados e intente nuevamente desde el menú.</p>
        <a class="btn btn-primario" th:href="@{/}">
            <svg th:replace="~{fragmentos/iconos :: icono('inicio')}"></svg> Volver al inicio
        </a>
    </section>
</main>
</body>
</html>
