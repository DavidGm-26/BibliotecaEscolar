<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Libro')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu('libros')}"></div>
<main class="contenido">
    <header class="titulo-pagina">
        <div>
            <h1 th:text="${libro.id == null} ? 'Nuevo libro' : 'Editar libro'">Libro</h1>
            <p>Complete los datos del libro.</p>
        </div>
    </header>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <section class="tarjeta">
        <form class="formulario" th:action="@{/libros}" th:object="${libro}" method="post">
            <input type="hidden" th:field="*{id}">

            <label for="codigo">Código</label>
            <input type="text" id="codigo" th:field="*{codigo}" maxlength="20">
            <span class="campo-error" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span>

            <label for="titulo">Título</label>
            <input type="text" id="titulo" th:field="*{titulo}" maxlength="150">
            <span class="campo-error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>

            <label for="autor">Autor</label>
            <input type="text" id="autor" th:field="*{autor}" maxlength="100">
            <span class="campo-error" th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}"></span>

            <label for="categoria">Categoría (opcional)</label>
            <input type="text" id="categoria" th:field="*{categoria}" maxlength="50">
            <span class="campo-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>

            <label for="ejemplares">Cantidad de ejemplares</label>
            <input type="number" id="ejemplares" th:field="*{ejemplares}" min="1">
            <span class="campo-error" th:if="${#fields.hasErrors('ejemplares')}" th:errors="*{ejemplares}"></span>

            <div class="acciones">
                <button type="submit" class="btn btn-primario">
                    <svg th:replace="~{fragmentos/iconos :: icono('check')}"></svg> Guardar
                </button>
                <a class="btn btn-secundario" th:href="@{/libros}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
